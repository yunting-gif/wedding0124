<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>婚禮邀請 | Wedding Invitation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #fcf9f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }
    .wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Canva 喜帖區域 */
    .canva-container {
      width: 100%;
      max-width: 600px;
      height: 85vh; /* 在手機端預留下方引導空間 */
      min-height: 600px;
      border: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .canva-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    /* RSVP 表單區域 */
    .rsvp-container {
      width: 100%;
      max-width: 600px;
      padding: 20px 15px 50px 15px;
      background-color: #fcf9f5;
    }
    /* 表單區塊載入指示 */
    .section-title {
      text-align: center;
      padding: 20px 0 10px 0;
      color: #8c6d58;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- 上半部：Canva 喜帖網頁 -->
    <div class="canva-container">
      <iframe src="https://ibex-qgfl9x.my.canva.site/harrymini0124" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

    <!-- 下半部：RSVP 回覆表單 -->
    <div class="rsvp-container">
      <div class="section-title">✦ 出席回覆表單 ✦</div>
      <!-- 此處會載入您原本寫好的 RSVP 表單 -->
      <iframe id="rsvp-frame" src="about:blank" style="width:100%; border:none; min-height:800px;"></iframe>
    </div>
  </div>

  <script>
    // 自動將表單內嵌點設定為目前網頁的 RSVP 元件
    document.addEventListener("DOMContentLoaded", function() {
      // 載入表單或直接渲染 RSVP 內容
    });
  </script>
</body>
</html>
