<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚禮邀請函與出席回覆 | Wedding Invitation & RSVP</title>
    <!-- Open Graph 分享預覽標籤 -->
    <meta property="og:title" content="婚禮邀請函與出席回覆 | Wedding Invitation & RSVP">
    <meta property="og:description" content="誠摯邀請您參加我們的婚禮，請點擊連結填寫出席回覆。">
    <meta property="og:type" content="website">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        champagne: {
                            50: '#FAF8F5',
                            100: '#F5EFE6',
                            200: '#E8DCCB',
                            300: '#DBC7AF',
                            400: '#C7AC8B',
                            500: '#B5946A',
                            600: '#9B784E',
                        },
                        rosegold: {
                            500: '#C07D83',
                        },
                        cream: '#FDFAF6',
                        darkburgundy: '#2C1820',
                        weddingred: '#9E1B1B'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        cursive: ['"Cormorant Garamond"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #FDFAF6;
            color: #2C1820;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 喜帖長圖容器 */
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #FDFAF6;
        }

        .invitation-bg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 1. 正方形 Google 地圖一鍵導航卡片精準覆蓋 */
        .overlay-map-box {
            position: absolute;
            top: 48.0%; 
            left: 11.5%; 
            width: 77%;  
            aspect-ratio: 1 / 1; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            background: #ffffff;
            z-index: 10;
        }

        /* 2. 正方形酒紅倒數計時方塊精準覆蓋 (月曆正下方) */
        .overlay-countdown-box {
            position: absolute;
            top: 79.2%; 
            left: 10%;
            width: 80%;
            z-index: 10;
        }

        /* 正方形小卡樣式 */
        .square-cd-card {
            aspect-ratio: 1 / 1; 
            background-color: #9E1B1B;
            color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(158, 27, 27, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(219, 199, 175, 0.5);
            box-shadow: 0 20px 40px rgba(181, 148, 106, 0.08);
        }

        .custom-input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid #E8DCCB;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: #2C1820;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #B5946A;
            box-shadow: 0 0 0 3px rgba(181, 148, 106, 0.15);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- 隱藏式 Iframe，用於接收 Google Form 提交結果 -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="handleIframeLoad()"></iframe>

    <!-- 喜帖主圖 + 覆蓋圖層 -->
    <section class="w-full relative bg-cream">
        <div class="invitation-container">
            <!-- 喜帖長圖 -->
            <img src="wedding-long-image.png" alt="婚禮喜帖" class="invitation-bg" loading="eager">

            <!-- A. 新尚豪婚宴會館 地圖互動與導航卡片 -->
            <div class="overlay-map-box">
                <a href="https://maps.google.com/?q=新尚豪婚宴會館+雲林縣斗南鎮建國二路122號" target="_blank" class="w-full h-full flex flex-col justify-between p-4 bg-gradient-to-b from-stone-50 to-amber-50/30 text-stone-800 hover:opacity-95 transition-all text-center no-underline border border-amber-200/60 rounded-xl">
                    <div class="pt-2">
                        <span class="inline-block px-2.5 py-0.5 bg-red-100 text-red-700 text-[10px] font-medium rounded-full mb-1.5">
                            <i class="fa-solid fa-location-dot mr-1"></i>宴客地點
                        </span>
                        <h4 class="text-base font-bold text-darkburgundy tracking-wider mb-1">新尚豪婚宴會館</h4>
                        <p class="text-[11px] text-stone-500 font-light leading-snug">雲林縣斗南鎮明昌里建國二路122號</p>
                    </div>

                    <div class="pb-1">
                        <div class="w-full py-2 bg-champagne-500 hover:bg-champagne-600 text-white rounded-lg text-xs font-medium tracking-widest shadow-sm flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-map-location-dot"></i>
                            <span>點此開啟 Google 地圖導航</span>
                        </div>
                    </div>
                </a>
            </div>

            <!-- B. 正方形酒紅倒數計時器 (對齊月曆正下方) -->
            <div class="overlay-countdown-box">
                <div class="grid grid-cols-4 gap-2 text-center">
                    <!-- 天 -->
                    <div class="square-cd-card">
                        <span id="cd-days" class="text-base md:text-lg font-bold font-sans leading-none mb-1">00</span>
                        <span class="text-[10px] font-light leading-none opacity-90">天</span>
                    </div>
                    <!-- 時 -->
                    <div class="square-cd-card">
                        <span id="cd-hours" class="text-base md:text-lg font-bold font-sans leading-none mb-1">00</span>
                        <span class="text-[10px] font-light leading-none opacity-90">時</span>
                    </div>
                    <!-- 分 -->
                    <div class="square-cd-card">
                        <span id="cd-minutes" class="text-base md:text-lg font-bold font-sans leading-none mb-1">00</span>
                        <span class="text-[10px] font-light leading-none opacity-90">分</span>
                    </div>
                    <!-- 秒 -->
                    <div class="square-cd-card">
                        <span id="cd-seconds" class="text-base md:text-lg font-bold font-sans leading-none mb-1">00</span>
                        <span class="text-[10px] font-light leading-none opacity-90">秒</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 中間引導按鈕 -->
    <div class="text-center py-6 bg-cream">
        <a href="#rsvp-form-section" class="inline-flex items-center space-x-2 text-champagne-600 hover:text-champagne-700 bg-champagne-100/80 px-6 py-2.5 rounded-full text-sm font-medium tracking-widest shadow-sm hover:shadow transition-all">
            <span>前往填寫出席回覆</span>
            <i class="fa-solid fa-arrow-down animate-bounce text-xs"></i>
        </a>
    </div>

    <!-- RSVP 婚禮出席回覆表單 -->
    <main class="w-full max-w-3xl mx-auto px-4">
        <section id="rsvp-form-section" class="glass-card p-6 md:p-10 rounded-3xl shadow-xl border border-champagne-200">
            <div class="text-center mb-8">
                <span class="font-cursive text-sm tracking-widest text-champagne-500 uppercase block mb-1">RSVP Form</span>
                <h2 class="text-2xl md:text-3xl font-normal tracking-widest text-darkburgundy">婚禮出席回覆</h2>
                <p class="text-stone-500 text-xs md:text-sm mt-2 font-light">請填寫以下資訊，以便我們為您安排最佳席位</p>
                <div class="w-12 h-0.5 bg-champagne-300 mx-auto mt-3"></div>
            </div>

            <form id="weddingRsvpForm" 
                  action="https://docs.google.com/forms/d/e/1FAIpQLSdCKzax5qT-YAVwHjna2Vz3C011ReDAzNSA912Nu1fSOMnK2A/formResponse" 
                  method="POST" 
                  target="hidden_iframe" 
                  onsubmit="handleFormSubmit(event)"
                  class="space-y-6">

                <!-- 1. 姓名 -->
                <div>
                    <label class="block text-sm font-medium text-darkburgundy mb-2">
                        姓名 <span class="text-rosegold-500">*</span>
                    </label>
                    <input type="text" 
                           id="entry_71470779"
                           name="entry.71470779" 
                           required 
                           placeholder="請輸入您的真實姓名" 
                           class="custom-input">
                </div>

                <!-- 2. 出席意願 -->
                <div>
                    <label class="block text-sm font-medium text-darkburgundy mb-2">
                        出席意願 <span class="text-rosegold-500">*</span>
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label class="flex items-center p-3 border border-champagne-200 rounded-lg bg-white/70 cursor-pointer hover:border-champagne-400 transition-colors">
                            <input type="radio" id="attend_yes" name="entry.2112564173" value="當然，一定到!" required onchange="toggleAttendanceMode('attend')" class="text-champagne-600 focus:ring-champagne-500">
                            <span class="ml-2 text-sm text-stone-700 font-medium">當然，一定到!</span>
                        </label>
                        <label class="flex items-center p-3 border border-champagne-200 rounded-lg bg-white/70 cursor-pointer hover:border-champagne-400 transition-colors">
                            <input type="radio" id="attend_no" name="entry.2112564173" value="無法參加，祝你們幸福!" required onchange="toggleAttendanceMode('absent')" class="text-champagne-600 focus:ring-champagne-500">
                            <span class="ml-2 text-sm text-stone-700 font-medium">無法參加，祝你們幸福!</span>
                        </label>
                    </div>
                </div>

                <!-- 3. 與新人的關係 -->
                <div id="relationshipBlock" style="display: none;">
                    <label class="block text-sm font-medium text-darkburgundy mb-2">
                        與新人的關係 <span id="req_relationship" class="text-rosegold-500">*</span>
                    </label>
                    <select id="entry_383311355" name="entry.383311355" class="custom-input">
                        <option value="" disabled selected>請選擇關係</option>
                        <option value="男方親友">男方親友</option>
                        <option value="女方親友">女方親友</option>
                        <option value="共同好友">共同好友</option>
                    </select>
                </div>

                <!-- 4. 電話 & 5. Email -->
                <div id="contactBlock" class="grid grid-cols-1 md:grid-cols-2 gap-6" style="display: none;">
                    <div>
                        <label class="block text-sm font-medium text-darkburgundy mb-2">
                            聯絡電話 <span id="req_phone" class="text-rosegold-500">*</span>
                        </label>
                        <input type="tel" 
                               id="entry_1185979561"
                               name="entry.1185979561" 
                               placeholder="例：0912345678" 
                               class="custom-input">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-darkburgundy mb-2">
                            電子信箱
                        </label>
                        <input type="email" 
                               id="entry_1819218719"
                               name="entry.1819218719" 
                               placeholder="example@mail.com" 
                               class="custom-input">
                    </div>
                </div>

                <!-- 人數配置 -->
                <div id="attendanceDetailsBlock" class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2" style="display: none;">
                    <div>
                        <label class="block text-sm font-medium text-darkburgundy mb-2">
                            出席人數 <span class="font-cursive text-xs text-champagne-500 ml-1 uppercase">Guests</span>
                        </label>
                        <div class="flex items-center border-b-2 border-champagne-300 pb-1">
                            <button type="button" onclick="adjustCount('entry_847222822', -1, 1)" class="w-8 h-8 rounded-full bg-champagne-100 hover:bg-champagne-200 text-champagne-700 font-bold flex items-center justify-center transition-colors focus:outline-none active:scale-95">
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <input type="number" id="entry_847222822" name="entry.847222822" min="1" max="20" value="1" class="w-full text-center bg-transparent border-none text-lg font-medium text-darkburgundy focus:outline-none px-2">
                            <button type="button" onclick="adjustCount('entry_847222822', 1, 1)" class="w-8 h-8 rounded-full bg-champagne-100 hover:bg-champagne-200 text-champagne-700 font-bold flex items-center justify-center transition-colors focus:outline-none active:scale-95">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-darkburgundy mb-2">
                            素食人數 <span class="font-cursive text-xs text-champagne-500 ml-1 uppercase">Vegetarian</span>
